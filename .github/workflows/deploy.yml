name: Deploy BE to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Test vẫn chạy trên mỗi push để có kết quả đỏ/xanh trên trang Actions, nhưng KHÔNG còn chặn deploy
  # (quyết định 2026-09-20): test đỏ từng làm deploy bị skip âm thầm, server chạy bản cũ trong khi DB đã
  # nâng ⇒ prod 500 mà không ai rõ vì sao. Đổi lại: test đỏ là tín hiệu để sửa, không phải cửa khoá.
  # Dùng lại test.yml qua workflow_call để không có hai bản cấu hình test lệch nhau.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    # always(): deploy chạy dù test đỏ. Vẫn giữ `needs` để deploy xếp SAU test (log đọc theo thứ tự) và
    # để kết quả test hiện ngay cạnh lần deploy tương ứng.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/fengdeskai/backend
            git fetch origin main
            git reset --hard origin/main

            # THỨ TỰ QUAN TRỌNG: build → migrate → mới swap container.
            # Trước đây `up -d --build` chạy TRƯỚC migrate, nên có một khoảng vài phút API mới đã nhận
            # traffic trong khi DB chưa có cột mới ⇒ mọi truy vấn chạm bảng đó trả 500 (đúng kiểu sự cố
            # 20/09). Migrate trước thì API CŨ vẫn phục vụ bình thường trong lúc DB được nâng.
            #
            # Chỉ an toàn với migration CỘNG THÊM (thêm cột/bảng/index) — code cũ không biết tới cột mới
            # nên không sao. Migration XOÁ cột/đổi kiểu phải tách hai lần deploy (expand → contract),
            # nếu không code cũ chết ngay khi migrate xong.
            docker compose build
            docker compose run --rm migrate
            docker compose up -d
            docker image prune -f
